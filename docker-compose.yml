services:

  scheduling-api:
    build:
      context: .
    command:
      [
        "uvicorn",
        "scheduling_api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    ports:
      - "18000:8000"
    networks:
      - lab-network

  ocr-mcp:
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "mcp_servers.ocr.server"
      ]
    env_file:
      - .env
    networks:
      - lab-network

  rag-mcp:
    build:
      context: .
    command:
      [
        "python",
        "-m",
        "mcp_servers.rag.server"
      ]
    env_file:
      - .env
    networks:
      - lab-network


  transpiler-api:
      build:
        context: .
      command:
        [
          "uvicorn",
          "transpiler.api:app",
          "--host",
          "0.0.0.0",
          "--port",
          "8003"
        ]
      ports:
        - "18003:8003"
      volumes:
        - generated-agents:/app/generated
      networks:
      - lab-network


  agent-runtime:
    build:
      context: .
    command:
      [
        "uvicorn",
        "runtime.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8004"
      ]
    ports:
      - "18004:8004"
    env_file:
      - .env
    volumes:
      - generated-agents:/app/generated
    depends_on:
      - ocr-mcp
      - rag-mcp
      - scheduling-api
    networks:
      - lab-network

volumes:
  generated-agents:
  
networks:
  lab-network:
    driver: bridge